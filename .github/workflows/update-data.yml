name: Update Economic Data

on:
  workflow_dispatch:
  schedule:
    # Weekdays at 13:15 UTC
    - cron: '15 13 * * 1-5'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull latest economic data from FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FRED_OBSERVATION_START: '2000-01-01'
          DASHBOARD_START_MONTH: '2000-01'
        run: npm run update:data

      - name: Commit and push if data changed
        run: |
          if git diff --quiet -- public/data/economic_indicators.csv; then
            echo "No data change detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/economic_indicators.csv
          git commit -m "chore(data): auto-update economic indicators CSV"
          git push origin main
