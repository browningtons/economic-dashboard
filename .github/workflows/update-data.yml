name: Update Economic Data

on:
  workflow_dispatch:
    inputs:
      requested_by:
        description: Optional initiator label
        required: false
        type: string
      requested_at:
        description: Optional client request timestamp
        required: false
        type: string
  schedule:
    # Weekdays at 13:15 UTC
    - cron: '15 13 * * 1-5'

permissions:
  contents: write
  issues: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preflight workflow configuration
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MARKET_CAP_MONTHLY_CSV_URL: ${{ secrets.MARKET_CAP_MONTHLY_CSV_URL }}
          MARKET_CAP_MONTHLY_CSV_PATH: ${{ secrets.MARKET_CAP_MONTHLY_CSV_PATH }}
          MARKET_CAP_MONTHLY_UNITS: ${{ secrets.MARKET_CAP_MONTHLY_UNITS }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "::error::Missing required GitHub secret: FRED_API_KEY"
            exit 1
          fi

          if [ -n "$MARKET_CAP_MONTHLY_CSV_URL" ] || [ -n "$MARKET_CAP_MONTHLY_CSV_PATH" ]; then
            echo "Monthly market-cap override detected."
            if [ -z "$MARKET_CAP_MONTHLY_UNITS" ]; then
              echo "::warning::MARKET_CAP_MONTHLY_UNITS is not set. The updater will fall back to FRED NCBCEL if the override cannot be parsed."
            fi
          else
            echo "No monthly market-cap override configured. Using FRED NCBCEL fallback."
          fi

      - name: Pull latest economic data from FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FRED_OBSERVATION_START: '2000-01-01'
          DASHBOARD_START_MONTH: '2000-01'
          MARKET_CAP_MONTHLY_CSV_URL: ${{ secrets.MARKET_CAP_MONTHLY_CSV_URL }}
          MARKET_CAP_MONTHLY_DATE_COLUMN: ${{ secrets.MARKET_CAP_MONTHLY_DATE_COLUMN }}
          MARKET_CAP_MONTHLY_VALUE_COLUMN: ${{ secrets.MARKET_CAP_MONTHLY_VALUE_COLUMN }}
          MARKET_CAP_MONTHLY_UNITS: ${{ secrets.MARKET_CAP_MONTHLY_UNITS }}
        run: npm run update:data

      - name: Validate refreshed data against thresholds
        id: validate
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          VALIDATE_OBSERVATION_START: '2024-01-01'
          VALIDATE_MONTH_WINDOW: '6'
          MARKET_CAP_MONTHLY_CSV_URL: ${{ secrets.MARKET_CAP_MONTHLY_CSV_URL }}
          MARKET_CAP_MONTHLY_DATE_COLUMN: ${{ secrets.MARKET_CAP_MONTHLY_DATE_COLUMN }}
          MARKET_CAP_MONTHLY_VALUE_COLUMN: ${{ secrets.MARKET_CAP_MONTHLY_VALUE_COLUMN }}
          MARKET_CAP_MONTHLY_UNITS: ${{ secrets.MARKET_CAP_MONTHLY_UNITS }}
        run: npm run validate:data

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-validation-report
          path: |
            reports/data-validation-latest.md
            reports/data-status-latest.json
            public/data/data_status.json

      - name: Open issue if validation fails
        if: steps.validate.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'reports/data-validation-latest.md';
            const body = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8').slice(0, 65000)
              : 'Validation failed but no report file was produced.';

            const title = 'Data validation alert';
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            const existing = openIssues.find((issue) => issue.title === title);
            const stampedBody = `## ${new Date().toISOString()}\n\n${body}`;

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: stampedBody
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: stampedBody
              });
            }

      - name: Send external validation alerts
        if: steps.validate.outcome == 'failure'
        continue-on-error: true
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
          ALERT_SUBJECT: 'Economic Dashboard validation failed'
        run: npm run alert:data

      - name: Commit and push if data changed
        if: always()
        run: |
          if git diff --quiet -- public/data/economic_indicators.csv public/data/data_status.json; then
            echo "No data change detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/economic_indicators.csv public/data/data_status.json
          git commit -m "chore(data): auto-update economic indicators snapshot"
          git push origin main

      - name: Mark run failed when validation fails
        if: steps.validate.outcome == 'failure'
        run: |
          echo "::error::Validation failed. See the uploaded artifact and issue comment for details."
          exit 1
