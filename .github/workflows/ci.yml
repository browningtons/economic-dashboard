name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily freshness sentinel (R1a): a refresh pipeline that stops firing
    # produces no failed run, so CI must check snapshot age on the wall clock
    # even when nobody pushes.
    - cron: '45 14 * * *'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # R1a: fail CI when the committed data snapshot is older than the
      # allowed window — surfaces a silently-stopped refresh pipeline.
      - run: npm run check:freshness
      # Fail the push/PR gate on a production-dependency advisory. Runs the exact
      # `audit:deps` script the scheduled dependency-audit.yml workflow runs, so
      # the push gate and the daily scheduled gate can never drift apart.
      - run: npm run audit:deps
